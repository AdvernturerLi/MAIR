# 论文同款（paper-faithful）配置：GPT-4o + DepictQA。
# 复制为 config.yml 使用，需要有效的 OpenAI API key。
# 注意：论文的 DepictQA（Vicuna-v1.5-7B 微调）仍需本地部署（见 README）。
OPENAI_API_KEY: "在此填入你的-OpenAI-API-KEY"
OPENAI_BASE_URL: "https://api.openai.com/v1"
OPENAI_MODEL: "gpt-4o"
MAX_TOKENS: 8192
TEMPERATURE: 0.0

STOP_THRESHOLD: "low"
USE_SIZE_HEURISTIC_FOR_SR: true
LOW_RES_MAX_SIDE: 300
LOW_RES_AS_BLUR: true
